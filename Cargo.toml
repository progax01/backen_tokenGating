[package]
name = "token-gating-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = "0.6.20"
tokio = { version = "1.35.1", features = ["full"] }
tower = "0.4.13"
tower-http = { version = "0.4.4", features = ["cors", "trace"] }

# Solana and Blockchain
anchor-client = "0.29.0"
solana-client = "1.17.3"
solana-sdk = "1.17.3"
solana-program = "1.17.3"
spl-associated-token-account = "2.1.0"

# Randomness and Key Generation
rand = { version = "0.8.5", features = ["std", "std_rng"] }
rand_core = { version = "0.6.4", features = ["std"] }

# Serialization
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
bincode = "1.3.3"
base64 = "0.21.5"

# Error Handling
thiserror = "1.0.56"
anyhow = "1.0.79"

# Logging
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

# Configuration
config = "0.13.4"
dotenv = "0.15.0"
dirs = "5.0.1"

# Validation
validator = "0.16.1"

# Time and Timestamp
chrono = "0.4.31"

# Clap
clap = { version = "4.3", features = ["derive"] }

[dev-dependencies]
mockall = "0.11.4"
httpmock = "0.7.0"

[features]
default = []
test = [] 